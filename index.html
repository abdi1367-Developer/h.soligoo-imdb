<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>گردونه سریال‌ها | هدیه از h.soligoo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');

        :root {
            --bg-dark: #05050d;
            --bg-mid: #0d0d20;
            --gold: #f0c040;
            --gold-soft: #ffd966;
            --gold-glow: rgba(240, 192, 64, 0.45);
            --red: #e63946;
            --pink: #d6336c;
            --purple: #6c5ce7;
            --glass-bg: rgba(255, 255, 255, 0.045);
            --glass-border: rgba(255, 255, 255, 0.09);
            --glass-highlight: rgba(255, 255, 255, 0.14);
            --text-main: #f0f0f5;
            --text-sub: #8888a0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100vh;
            height: 100dvh;
            width: 100%;
            position: fixed;
            inset: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background:
                radial-gradient(circle at 50% -10%, #2a1a4a 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, #1a1a3e 0%, transparent 50%),
                radial-gradient(circle at 0% 80%, #3e1a2a 0%, transparent 50%),
                var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* --- Instagram Gift Banner --- */
        .gift-banner {
            flex-shrink: 0;
            margin: 10px 14px 0;
            padding: 9px 14px;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(214, 51, 108, 0.15), rgba(108, 92, 231, 0.15));
            border: 1px solid rgba(214, 51, 108, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .gift-banner::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transform: translateX(-100%);
            animation: shine 3.5s ease-in-out infinite;
        }

        @keyframes shine {
            0%, 60% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .gift-banner:active {
            transform: scale(0.97);
        }

        .gift-banner .ig-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 4px rgba(214, 51, 108, 0.6));
        }

        .gift-banner .gift-text {
            font-size: 0.78rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .gift-banner .gift-label {
            color: #ffb8d4;
            font-weight: 400;
            font-size: 0.72rem;
        }

        .gift-banner .gift-user {
            background: linear-gradient(90deg, #ffd966, #ff8fb3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 900;
            font-size: 0.82rem;
            direction: ltr;
        }

        /* --- Title --- */
        .app-title {
            flex-shrink: 0;
            text-align: center;
            font-size: 0.95rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold-glow);
            padding: 10px 16px 6px;
            letter-spacing: 0.3px;
        }

        /* --- Tabs --- */
        .tabs {
            flex-shrink: 0;
            display: flex;
            gap: 8px;
            padding: 4px 14px 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            color: var(--text-sub);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(240, 192, 64, 0.2), rgba(214, 51, 108, 0.15));
            color: var(--gold);
            border-color: rgba(240, 192, 64, 0.45);
            box-shadow: 0 0 20px rgba(240, 192, 64, 0.18), inset 0 0 12px rgba(240,192,64,0.08);
        }

        .tab-btn:active { transform: scale(0.97); }

        /* --- Tab Content --- */
        .tab-content {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
        }

        .tab-panel {
            position: absolute;
            inset: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 8px 14px 20px;
            display: none;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .tab-panel::-webkit-scrollbar { display: none; }
        .tab-panel.active { display: block; }

        #tab-wheel.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ========== WHEEL ========== */
        .wheel-stage {
            position: relative;
            width: min(290px, 78vw);
            height: min(290px, 78vw);
            flex-shrink: 0;
            margin: 6px auto 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Rotating outer ring */
        .outer-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px dashed rgba(240, 192, 64, 0.25);
            animation: rotateSlow 30s linear infinite;
        }

        @keyframes rotateSlow {
            to { transform: rotate(360deg); }
        }

        /* Glow aura */
        .wheel-stage::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                rgba(240,192,64,0.35),
                rgba(214,51,108,0.35),
                rgba(108,92,231,0.35),
                rgba(240,192,64,0.35));
            filter: blur(22px);
            opacity: 0.55;
            animation: hueSpin 8s linear infinite;
            z-index: 0;
        }

        @keyframes hueSpin {
            to { transform: rotate(360deg); }
        }

        /* Inner bezel */
        .wheel-bezel {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            padding: 5px;
            background: radial-gradient(circle at 50% 50%, rgba(20,20,40,0.9), rgba(10,10,20,0.95));
            border: 1px solid rgba(240, 192, 64, 0.35);
            box-shadow:
                0 0 25px rgba(240, 192, 64, 0.15),
                inset 0 0 30px rgba(0,0,0,0.9),
                inset 0 2px 0 rgba(255,255,255,0.08);
            z-index: 1;
        }

        .wheel-svg {
            width: 100%;
            height: 100%;
            transform-origin: center;
            transition: transform 3.8s cubic-bezier(0.15, 0.9, 0.2, 1);
            border-radius: 50%;
            display: block;
            filter: drop-shadow(0 0 6px rgba(0,0,0,0.6));
        }

        /* Pointer */
        .wheel-pointer {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 13px solid transparent;
            border-right: 13px solid transparent;
            border-top: 22px solid var(--gold);
            filter: drop-shadow(0 4px 8px rgba(240, 192, 64, 0.9));
            z-index: 10;
        }

        .wheel-pointer::before {
            content: '';
            position: absolute;
            top: -30px;
            left: -8px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle, #fff, var(--gold));
            box-shadow: 0 0 18px var(--gold), 0 0 30px var(--gold-glow);
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.25); opacity: 0.75; }
        }

        /* Center button */
        .spin-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 74px;
            height: 74px;
            border-radius: 50%;
            border: 2px solid rgba(240, 192, 64, 0.6);
            background:
                radial-gradient(circle at 30% 25%, rgba(255,255,255,0.15), transparent 60%),
                linear-gradient(135deg, #2a1428, #1a0a18);
            color: var(--gold);
            font-family: inherit;
            font-size: 0.72rem;
            font-weight: 900;
            cursor: pointer;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            line-height: 1.1;
            box-shadow:
                0 0 30px rgba(214, 51, 108, 0.4),
                0 0 60px rgba(240, 192, 64, 0.2),
                inset 0 0 15px rgba(240, 192, 64, 0.15);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .spin-btn .spin-icon {
            font-size: 1.35rem;
            display: block;
            transition: transform 0.4s ease;
        }

        .spin-btn:active {
            transform: translate(-50%, -50%) scale(0.9);
            box-shadow:
                0 0 50px rgba(214, 51, 108, 0.7),
                0 0 90px rgba(240, 192, 64, 0.4);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spin-btn:disabled .spin-icon {
            animation: spinFast 0.7s linear infinite;
        }

        @keyframes spinFast {
            to { transform: rotate(360deg); }
        }

        /* ========== RESULT ========== */
        .result {
            display: none;
            width: 100%;
            max-width: 430px;
            border-radius: 20px;
            padding: 14px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.55), inset 0 1px 0 var(--glass-highlight);
            animation: slideUp 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .result::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255,255,255,0.06), transparent);
            pointer-events: none;
        }

        .result.show { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(28px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Show Detail Components */
        .poster-box {
            width: 100%;
            height: 300px;
            border-radius: 14px;
            overflow: hidden;
            background: #0f0f20;
            margin-bottom: 12px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .poster-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .poster-box .no-img {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            font-size: 2.8rem;
            gap: 8px;
        }
        .poster-box .no-img span:last-child { font-size: 0.85rem; }

        .rank-tag {
            position: absolute;
            top: 10px;
            right: 10px;
            background: linear-gradient(135deg, var(--gold), #ffb347);
            color: #000;
            font-weight: 900;
            font-size: 0.78rem;
            padding: 4px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 18px rgba(240, 192, 64, 0.55);
            z-index: 5;
        }

        .show-title {
            font-size: 1.2rem;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 3px;
            text-shadow: 0 0 15px rgba(240, 192, 64, 0.25);
            position: relative;
            z-index: 2;
        }

        .show-year {
            font-size: 0.78rem;
            color: var(--text-sub);
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 8px 10px;
            text-align: right;
        }

        .info-item .lbl {
            font-size: 0.63rem;
            color: var(--text-sub);
            margin-bottom: 2px;
        }

        .info-item .val {
            font-size: 0.78rem;
            font-weight: 700;
            line-height: 1.4;
        }

        .desc-box {
            background: rgba(0, 0, 0, 0.22);
            border-radius: 12px;
            padding: 11px 13px;
            font-size: 0.8rem;
            line-height: 1.85;
            color: #ccc;
            border-right: 3px solid var(--gold);
            text-align: right;
            position: relative;
            z-index: 2;
        }

        .special-box {
            display: none;
            align-items: flex-start;
            gap: 8px;
            background: linear-gradient(135deg, rgba(240,192,64,0.08), rgba(214,51,108,0.06));
            border: 1px solid rgba(240, 192, 64, 0.18);
            border-radius: 12px;
            padding: 9px 11px;
            font-size: 0.76rem;
            color: #e8c86a;
            line-height: 1.7;
            text-align: right;
            margin-top: 9px;
            position: relative;
            z-index: 2;
        }
        .special-box.show { display: flex; }
        .special-box .ic { font-size: 1.05rem; flex-shrink: 0; }

        /* Loading */
        .loading {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 18px;
        }
        .loading.show { display: flex; }

        .spinner {
            width: 34px;
            height: 34px;
            border: 3px solid rgba(255,255,255,0.05);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            box-shadow: 0 0 15px var(--gold-glow);
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ========== LIST ========== */
        #tab-list { padding-top: 0; }

        .search-wrap {
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 4px 0 10px;
            background: linear-gradient(180deg, var(--bg-dark) 65%, transparent);
        }

        .search-input {
            width: 100%;
            padding: 11px 16px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .search-input::placeholder { color: var(--text-sub); }
        .search-input:focus {
            border-color: rgba(240, 192, 64, 0.5);
            box-shadow: 0 0 18px rgba(240, 192, 64, 0.18);
        }

        .list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 12px;
            border-radius: 12px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            margin-bottom: 7px;
            cursor: pointer;
            transition: all 0.15s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .list-item:active {
            background: rgba(240, 192, 64, 0.1);
            border-color: rgba(240, 192, 64, 0.4);
            transform: scale(0.99);
        }

        .list-rank {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background: rgba(240, 192, 64, 0.12);
            color: var(--gold);
            font-weight: 900;
            font-size: 0.75rem;
            border: 1px solid rgba(240, 192, 64, 0.22);
        }

        .list-title {
            flex: 1;
            font-size: 0.82rem;
            font-weight: 700;
            text-align: right;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .list-year {
            flex-shrink: 0;
            font-size: 0.68rem;
            color: var(--text-sub);
            direction: ltr;
        }

        .empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            font-size: 0.85rem;
        }

        /* ========== MODAL ========== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 16px;
            animation: fadeIn 0.22s ease;
        }
        .modal.show { display: flex; }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            width: 100%;
            max-width: 430px;
            max-height: 88dvh;
            overflow-y: auto;
            border-radius: 20px;
            padding: 14px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), inset 0 1px 0 var(--glass-highlight);
            position: relative;
            animation: slideUp 0.32s ease;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }
        .modal-content::-webkit-scrollbar { display: none; }

        .modal-close {
            position: sticky;
            top: 0;
            float: left;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.55);
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: -34px;
        }
        .modal-close:active { transform: scale(0.9); }

        @media (max-width: 360px) {
            .wheel-stage { width: min(250px, 76vw); height: min(250px, 76vw); }
            .spin-btn { width: 62px; height: 62px; font-size: 0.65rem; }
            .spin-btn .spin-icon { font-size: 1.15rem; }
            .poster-box { height: 260px; }
            .show-title { font-size: 1.05rem; }
            .app-title { font-size: 0.85rem; }
            .tab-btn { font-size: 0.75rem; padding: 9px; }
            .gift-banner .gift-text { font-size: 0.72rem; }
        }
    </style>
</head>
<body>

    <!-- Instagram Gift -->
    <a class="gift-banner" href="https://instagram.com/h.soligoo" target="_blank" rel="noopener noreferrer">
        <svg class="ig-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="igGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#feda75"/>
                    <stop offset="30%" stop-color="#fa7e1e"/>
                    <stop offset="60%" stop-color="#d62976"/>
                    <stop offset="100%" stop-color="#962fbf"/>
                </linearGradient>
            </defs>
            <rect x="2" y="2" width="20" height="20" rx="6" stroke="url(#igGrad)" stroke-width="1.8"/>
            <circle cx="12" cy="12" r="4.5" stroke="url(#igGrad)" stroke-width="1.8"/>
            <circle cx="17.5" cy="6.5" r="1.2" fill="url(#igGrad)"/>
        </svg>
        <span class="gift-text">
            <span class="gift-label">هدیه از طرف اینستاگرام:</span>
            <span class="gift-user">h.soligoo</span>
        </span>
    </a>

    <div class="app-title">🎬 ۱۰۰ سریال برتر قرن ۲۱</div>

    <nav class="tabs">
        <button class="tab-btn active" data-tab="wheel">🎡 گردونه</button>
        <button class="tab-btn" data-tab="list">📋 لیست</button>
    </nav>

    <main class="tab-content">
        <!-- Wheel Tab -->
        <section id="tab-wheel" class="tab-panel active">
            <div class="wheel-stage">
                <div class="outer-ring"></div>
                <div class="wheel-pointer"></div>
                <div class="wheel-bezel">
                    <svg class="wheel-svg" id="wheelSvg" viewBox="0 0 300 300"></svg>
                </div>
                <button class="spin-btn" id="spinBtn">
                    <span class="spin-icon">🎲</span>
                    <span>بچرخون</span>
                </button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <span style="color: var(--text-sub); font-size: 0.75rem;">در حال دریافت اطلاعات...</span>
            </div>

            <div class="result" id="result">
                <div id="resultBody"></div>
            </div>
        </section>

        <!-- List Tab -->
        <section id="tab-list" class="tab-panel">
            <div class="search-wrap">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 جستجوی سریال..." autocomplete="off">
            </div>
            <div id="listContainer"></div>
        </section>
    </main>

    <!-- Detail Modal -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>

<script>

    {r:97,t:"Community",y:"2009–2015",g:"کمدی",c:"آمریکا",ba:"جوئل مک‌هیل",v:"۲–۴ میلیون",sp:"کمدی متا و خلاقانه.",d:"گروهی از دانشجویان یک کالج اجتماعی با پیشینه‌های متفاوت، ماجراجویی‌های عجیبی را تجربه می‌کنند."},
    {r:98,t:"The OA",y:"2016–2019",g:"علمی-تخیلی، درام",c:"آمریکا",ba:"بریت مارلینگ",v:"۰.۵–۱ میلیون",sp:"سریالی جسورانه درباره ایمان و واقعیت.",d:"زنی پس از هفت سال مفقود بودن بازمی‌گردد و توانایی‌های مرموزی از خود نشان می‌دهد."},
    {r:99,t:"Gilmore Girls",y:"2000–2007",g:"کمدی-درام",c:"آمریکا",ba:"لورن گرهم",v:"۴–۶ میلیون",sp:"سریالی گرم درباره خانواده و اجتماع.",d:"داستان رابطه نزدیک بین لورلای و دختر نوجوانش، روری، در شهر کوچک استارز هالو."},
    {r:100,t:"Scandal",y:"2012–2018",g:"درام سیاسی",c:"آمریکا",ba:"کری واشینگتن",v:"۸–۱۰ میلیون",sp:"سریالی پرهیجان.",d:"اولیویا پوپ، یک متخصص بحران، به شخصیت‌های قدرتمند واشینگتن دی‌سی در پنهان کردن رازهایشان کمک می‌کند."}

// ========== DOM ==========
const svg = document.getElementById('wheelSvg');
const spinBtn = document.getElementById('spinBtn');
const result = document.getElementById('result');
const resultBody = document.getElementById('resultBody');
const loading = document.getElementById('loading');
const tabButtons = document.querySelectorAll('.tab-btn');
const tabPanels = document.querySelectorAll('.tab-panel');
const searchInput = document.getElementById('searchInput');
const listContainer = document.getElementById('listContainer');
const detailModal = document.getElementById('detailModal');
const modalBody = document.getElementById('modalBody');
const modalClose = document.getElementById('modalClose');

// ========== WHEEL BUILD ==========
const N = 100;
const CX = 150, CY = 150, R = 138;
let rotation = 0;
let spinning = false;
let used = new Set();
const ns = 'http://www.w3.org/2000/svg';

// Rich color palette for slices - alternating warm/cool for visual rhythm
const slicePalette = [
    '#1a0f2e', '#2a1a3e', '#3a1a3e', '#2a0f2e',
    '#1a1a3e', '#20204a', '#1e1e3a', '#2a2045'
];

// Build pie slices
for (let i = 0; i < N; i++) {
    const a1 = (i / N) * 2 * Math.PI - Math.PI / 2;
    const a2 = ((i + 1) / N) * 2 * Math.PI - Math.PI / 2;
    const x1 = CX + R * Math.cos(a1), y1 = CY + R * Math.sin(a1);
    const x2 = CX + R * Math.cos(a2), y2 = CY + R * Math.sin(a2);
    const large = (a2 - a1) > Math.PI ? 1 : 0;

    const path = document.createElementNS(ns, 'path');
    path.setAttribute('d', `M${CX},${CY} L${x1},${y1} A${R},${R} 0 ${large} 1 ${x2},${y2} Z`);
    path.setAttribute('fill', slicePalette[i % slicePalette.length]);
    path.setAttribute('stroke', 'rgba(240, 192, 64, 0.12)');
    path.setAttribute('stroke-width', '0.4');
    svg.appendChild(path);
}

// Gold tick marks every 5th slice
for (let i = 0; i < N; i++) {
    const a = (i / N) * 2 * Math.PI - Math.PI / 2;
    const isMajor = i % 5 === 0;
    const r1 = isMajor ? R - 12 : R - 6;
    const r2 = R;
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', CX + r1 * Math.cos(a));
    line.setAttribute('y1', CY + r1 * Math.sin(a));
    line.setAttribute('x2', CX + r2 * Math.cos(a));
    line.setAttribute('y2', CY + r2 * Math.sin(a));
    line.setAttribute('stroke', isMajor ? 'rgba(240, 192, 64, 0.55)' : 'rgba(240, 192, 64, 0.2)');
    line.setAttribute('stroke-width', isMajor ? '1.2' : '0.8');
    svg.appendChild(line);
}

// Decorative gold dots at major ticks
for (let i = 0; i < N; i += 10) {
    const a = (i / N) * 2 * Math.PI - Math.PI / 2;
    const dot = document.createElementNS(ns, 'circle');
    dot.setAttribute('cx', CX + (R - 18) * Math.cos(a));
    dot.setAttribute('cy', CY + (R - 18) * Math.sin(a));
    dot.setAttribute('r', '1.6');
    dot.setAttribute('fill', 'rgba(240, 192, 64, 0.7)');
    svg.appendChild(dot);
}

// Inner decorative ring
const innerRing = document.createElementNS(ns, 'circle');
innerRing.setAttribute('cx', CX);
innerRing.setAttribute('cy', CY);
innerRing.setAttribute('r', '42');
innerRing.setAttribute('fill', 'none');
innerRing.setAttribute('stroke', 'rgba(240, 192, 64, 0.15)');
innerRing.setAttribute('stroke-width', '0.8');
innerRing.setAttribute('stroke-dasharray', '2,3');
svg.appendChild(innerRing);

// Center circle (behind button)
const centerCircle = document.createElementNS(ns, 'circle');
centerCircle.setAttribute('cx', CX);
centerCircle.setAttribute('cy', CY);
centerCircle.setAttribute('r', '38');
centerCircle.setAttribute('fill', 'rgba(8, 8, 16, 0.95)');
centerCircle.setAttribute('stroke', 'rgba(240, 192, 64, 0.4)');
centerCircle.setAttribute('stroke-width', '1.2');
svg.appendChild(centerCircle);

// ========== POSTER FETCH ==========
const posterCache = new Map();

async function getPosterUrl(title) {
    if (posterCache.has(title)) return posterCache.get(title);
    try {
        const res = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${encodeURIComponent(title)}`);
        if (res.ok) {
            const data = await res.json();
            if (data && data.image && (data.image.original || data.image.medium)) {
                const url = data.image.original || data.image.medium;
                posterCache.set(title, url);
                return url;
            }
        }
    } catch (e) { /* ignore */ }
    const colors = ['1a1a2e','16213e','0f3460','1a1a3e','2d2d44'];
    const bg = colors[title.length % colors.length];
    const url = `https://placehold.co/500x750/${bg}/f0c040?text=${encodeURIComponent(title)}&font=roboto`;
    posterCache.set(title, url);
    return url;
}

// ========== DETAILS HTML ==========
function showDetailsHTML(show, posterUrl) {
    const fields = [
        ['🎭 ژانر', show.g],
        ['🌍 کشور', show.c],
        ['🏆 بهترین بازیگر', show.ba],
        ['📊 بیننده', show.v]
    ].filter(([_, v]) => v && v !== '—');

    const infoHTML = fields.length > 0 ? `
        <div class="info-grid">
            ${fields.map(([l, v]) => `
                <div class="info-item">
                    <div class="lbl">${l}</div>
                    <div class="val">${v}</div>
                </div>
            `).join('')}
        </div>
    ` : '';

    const specialHTML = show.sp ? `
        <div class="special-box show">
            <span class="ic">✨</span>
            <span>${show.sp}</span>
        </div>
    ` : '';

    return `
        <div class="poster-box">
            <span class="rank-tag">#${show.r}</span>
            <img src="${posterUrl}" alt="${show.t}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="no-img" style="display:none">
                <span>📺</span>
                <span>پوستر موجود نیست</span>
            </div>
        </div>
        <div class="show-title">${show.t}</div>
        <div class="show-year">📅 ${show.y}</div>
        ${infoHTML}
        <div class="desc-box">${show.d || ''}</div>
        ${specialHTML}
    `;
}

// ========== RANDOM PICK ==========
function randIndex() {
    if (used.size >= shows.length) used.clear();
    let i;
    do { i = Math.floor(Math.random() * shows.length); } while (used.has(i));
    used.add(i);
    return i;
}

async function displayWheelResult(show) {
    resultBody.innerHTML = '<div style="text-align:center;padding:40px;color:#888;font-size:0.85rem">در حال دریافت پوستر...</div>';
    result.classList.add('show');
    const posterUrl = await getPosterUrl(show.t);
    resultBody.innerHTML = showDetailsHTML(show, posterUrl);
}

spinBtn.addEventListener('click', async () => {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    result.classList.remove('show');
    loading.classList.add('show');

    const extra = 4 + Math.floor(Math.random() * 4);
    rotation += extra * 360 + Math.floor(Math.random() * 360);
    svg.style.transform = `rotate(${rotation}deg)`;

    setTimeout(async () => {
        try {
            const idx = randIndex();
            await displayWheelResult(shows[idx]);
            setTimeout(() => {
                result.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 120);
        } catch (e) {
            resultBody.innerHTML = '<div style="text-align:center;padding:30px;color:#e63946;font-size:0.85rem">خطا در دریافت اطلاعات</div>';
            result.classList.add('show');
        } finally {
            spinning = false;
            spinBtn.disabled = false;
            loading.classList.remove('show');
        }
    }, 3900);
});

// ========== TABS ==========
tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        const target = btn.dataset.tab;
        tabButtons.forEach(b => b.classList.toggle('active', b === btn));
        tabPanels.forEach(p => p.classList.toggle('active', p.id === 'tab-' + target));
    });
});

// ========== LIST ==========
function renderList(filter = '') {
    const q = filter.trim().toLowerCase();
    const filtered = !q ? shows : shows.filter(s =>
        s.t.toLowerCase().includes(q) || s.y.includes(q)
    );
    if (filtered.length === 0) {
        listContainer.innerHTML = '<div class="empty">😕 نتیجه‌ای یافت نشد</div>';
        return;
    }
    listContainer.innerHTML = filtered.map(s => `
        <div class="list-item" data-rank="${s.r}">
            <span class="list-rank">${s.r}</span>
            <span class="list-title">${s.t}</span>
            <span class="list-year">${s.y}</span>
        </div>
    `).join('');
}

renderList();

let searchTimer;
searchInput.addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => renderList(e.target.value), 120);
});

// ========== LIST ITEM CLICK ==========
listContainer.addEventListener('click', async (e) => {
    const item = e.target.closest('.list-item');
    if (!item) return;
    const rank = parseInt(item.dataset.rank, 10);
    const show = shows.find(s => s.r === rank);
    if (!show) return;

    modalBody.innerHTML = '<div style="text-align:center;padding:40px;color:#888;font-size:0.85rem">در حال دریافت پوستر...</div>';
    detailModal.classList.add('show');

    const posterUrl = await getPosterUrl(show.t);
    modalBody.innerHTML = showDetailsHTML(show, posterUrl);
});

modalClose.addEventListener('click', () => detailModal.classList.remove('show'));
detailModal.addEventListener('click', (e) => {
    if (e.target === detailModal) detailModal.classList.remove('show');
});
</script>
</body>
</html>
